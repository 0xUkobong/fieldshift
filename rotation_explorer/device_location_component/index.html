<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        color: #1e1e1f;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: transparent; }
      .control { display: grid; gap: 7px; }
      button {
        min-height: 42px;
        width: max-content;
        max-width: 100%;
        padding: 10px 16px;
        border: 0;
        border-radius: 22px;
        background: #8ec7e2;
        color: #000;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.25;
        cursor: pointer;
        touch-action: manipulation;
        transition: background-color .15s ease;
      }
      button:hover:not(:disabled) { background: #a6d5e9; }
      button:focus-visible { outline: 2px solid #1e1e1f; outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: .72; }
      .detail, .status { margin: 0; font-size: 12px; line-height: 1.45; }
      .detail { color: #626263; }
      .status { color: #1e1e1f; }
      @media (max-width: 540px) {
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="control">
      <button id="locate" type="button">◎ &nbsp; Capture Current Coordinates</button>
      <p class="detail">Only after you tap. Your browser will ask; coordinates go to Field Shift for this field, with no background tracking.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <script>
      (() => {
        const button = document.getElementById("locate");
        const status = document.getElementById("status");
        let busy = false;
        let componentReady = false;

        function send(type, payload = {}) {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type,
            ...payload,
          }, "*");
        }

        function setValue(value) {
          send("streamlit:setComponentValue", { value });
        }

        function setFrameHeight() {
          requestAnimationFrame(() => send("streamlit:setFrameHeight", {
            height: document.documentElement.scrollHeight,
          }));
        }

        button.addEventListener("click", () => {
          if (busy) return;
          if (!window.isSecureContext || !navigator.geolocation) {
            status.textContent = "Device location is unavailable here. Use place search, the map, or coordinates instead.";
            setValue({ error: "unavailable", eventId: Date.now() });
            setFrameHeight();
            return;
          }

          busy = true;
          button.disabled = true;
          status.textContent = "Waiting for your browser’s permission…";
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude, accuracy } = position.coords;
              const roundedAcc = Number.isFinite(accuracy) ? Math.round(accuracy) : null;
              status.textContent = roundedAcc !== null
                ? `Captured coordinates: ${latitude.toFixed(4)}°, ${longitude.toFixed(4)}° (±${roundedAcc} m).`
                : `Captured coordinates: ${latitude.toFixed(4)}°, ${longitude.toFixed(4)}°.`;
              setValue({
                lat: latitude,
                lon: longitude,
                accuracy: Number.isFinite(accuracy) ? accuracy : null,
                eventId: Date.now(),
              });
              setFrameHeight();
              button.disabled = false;
              busy = false;
            },
            (error) => {
              const messages = {
                1: "Location permission was not granted. You can allow it in browser settings, or use search, the map, or coordinates.",
                2: "Your device could not determine a location. Try again or use search, the map, or coordinates.",
                3: "The location request took too long. Try again or use search, the map, or coordinates.",
              };
              const message = messages[error.code] || "Device location is unavailable. Use search, the map, or coordinates.";
              status.textContent = message;
              setValue({ error: error.code || "unknown", eventId: Date.now() });
              setFrameHeight();
              button.disabled = false;
              busy = false;
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 },
          );
        });

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent || !event.data) return;
          if (event.data.type === "streamlit:render") {
            componentReady = true;
            if (event.data.args && event.data.args.button_label) {
              button.innerHTML = event.data.args.button_label;
            }
            setFrameHeight();
          }
        });

        function announceReady() {
          if (componentReady) return;
          send("streamlit:componentReady", { apiVersion: 1 });
          window.setTimeout(announceReady, 100);
        }

        announceReady();
        setFrameHeight();
      })();
    </script>
  </body>
</html>
